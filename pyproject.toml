[project]
name = "pl-predictions"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "danick-T", email = "danick.tchang4@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
pl-predictions = "pl_predictions:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
